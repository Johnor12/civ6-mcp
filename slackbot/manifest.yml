# Paste at api.slack.com/apps > civ6 > App Manifest to apply or compare the settings.
# No secrets here. Tokens go in SLACK_BOT_TOKEN and SLACK_APP_TOKEN on the civ machine.
display_information:
  name: civ6
  description: DM a prompt and Claude plays your Civ 6 turn.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: civ6
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - chat:write
      - files:write
      - im:history
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
