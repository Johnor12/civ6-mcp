# Paste at api.slack.com/apps > civ6 > App Manifest to compare or apply the settings.
# No secrets here: tokens go in .env (see .env.example).
display_information:
  name: civ6
  description: Message it on your turn and Claude plays your Civ 6 turn.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: civ6
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:write
      - im:history
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
