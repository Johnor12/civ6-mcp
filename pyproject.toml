[project]
name = "civ6-mcp"
version = "2.0.0"
description = "MCP server that plays an absent player's turn in a local Civilization VI hotseat game"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20,<2",
]

[project.scripts]
civ-mcp = "civ_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civ_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
slackbot = [
    "slack-bolt>=1.18",
    "aiohttp>=3.9",
    "mss>=9.0",
    "tzdata>=2024.1",  # Windows has no system time zone database
]

[tool.pytest.ini_options]
testpaths = ["tests", "slackbot/tests"]
pythonpath = ["."]
